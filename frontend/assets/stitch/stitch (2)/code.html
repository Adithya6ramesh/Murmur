<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Murmur | Analyzing...</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Manrope:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-tertiary-fixed": "#3c0800",
                        "inverse-surface": "#e2e2e2",
                        "secondary-fixed": "#dae4e8",
                        "surface-container-low": "#1a1c1c",
                        "on-secondary-fixed": "#131d20",
                        "on-tertiary": "#5d1805",
                        "on-surface": "#e2e2e2",
                        "on-primary-fixed-variant": "#2d4c46",
                        "tertiary-fixed-dim": "#ffb4a1",
                        "on-secondary": "#283235",
                        "surface-container": "#1e2020",
                        "inverse-on-surface": "#2f3131",
                        "primary-container": "#84a59d",
                        "error": "#ffb4ab",
                        "surface-dim": "#121414",
                        "error-container": "#93000a",
                        "secondary-container": "#3e484c",
                        "inverse-primary": "#45645e",
                        "primary-fixed": "#c7eae1",
                        "on-tertiary-container": "#651d09",
                        "on-error-container": "#ffdad6",
                        "tertiary": "#ffb4a1",
                        "surface": "#121414",
                        "surface-bright": "#383939",
                        "outline": "#8b9290",
                        "primary": "#accec5",
                        "on-background": "#e2e2e2",
                        "tertiary-container": "#ea8266",
                        "surface-tint": "#accec5",
                        "on-secondary-fixed-variant": "#3e484c",
                        "outline-variant": "#414846",
                        "tertiary-fixed": "#ffdbd2",
                        "secondary-fixed-dim": "#bec8cc",
                        "primary-fixed-dim": "#accec5",
                        "on-secondary-container": "#acb7ba",
                        "surface-container-high": "#282a2a",
                        "on-error": "#690005",
                        "surface-variant": "#333535",
                        "surface-container-lowest": "#0d0f0f",
                        "on-surface-variant": "#c1c8c5",
                        "on-primary": "#163630",
                        "on-primary-container": "#1b3b35",
                        "on-primary-fixed": "#00201b",
                        "surface-container-highest": "#333535",
                        "on-tertiary-fixed-variant": "#7c2e19",
                        "secondary": "#bec8cc",
                        "background": "#121414"
                    },
                    fontFamily: {
                        "headline": ["Space Grotesk"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .orb-blur {
            filter: blur(80px);
        }
        @keyframes morph {
            0%, 100% { border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%; transform: scale(1) rotate(0deg); }
            33% { border-radius: 70% 30% 46% 54% / 30% 29% 71% 70%; transform: scale(1.05) rotate(120deg); }
            66% { border-radius: 100% 60% 60% 100% / 100% 100% 60% 60%; transform: scale(0.95) rotate(240deg); }
        }
        .organic-pulse {
            animation: morph 12s ease-in-out infinite alternate;
            background: radial-gradient(circle at 30% 30%, #84A59D, #45645e);
        }
        .glow-layer {
            animation: morph 15s ease-in-out infinite alternate-reverse;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body overflow-hidden">
<!-- Top Navigation Anchor -->
<header class="bg-transparent font-['Space_Grotesk'] text-sm tracking-tight fixed top-0 left-0 w-full z-50 flex justify-between items-center px-6 py-6">
<div class="text-2xl font-bold tracking-tighter text-primary">Murmur</div>
<div class="flex items-center gap-4">
<span class="text-primary/40 text-[10px] uppercase tracking-[0.2em] font-medium">Analyzing</span>
<button class="text-primary hover:bg-white/5 transition-colors duration-300 p-2 rounded-full scale-95 active:scale-90 transition-transform">
<span class="material-symbols-outlined">close</span>
</button>
</div>
</header>
<!-- Main Canvas: Central Visual Resonance -->
<main class="relative min-h-screen w-full flex flex-col items-center justify-center">
<div class="relative w-[300px] h-[300px] md:w-[450px] md:h-[450px] flex items-center justify-center">
<!-- Outermost ambient glow -->
<div class="absolute inset-[-40%] bg-primary-container/10 rounded-full orb-blur opacity-60"></div>
<!-- Secondary morphing glow -->
<div class="absolute inset-0 bg-[#84A59D]/20 glow-layer orb-blur scale-150"></div>
<!-- The Central Organic Core -->
<div class="organic-pulse relative w-full h-full shadow-[0_0_120px_rgba(132,165,157,0.3)] flex items-center justify-center overflow-hidden">
<!-- Inner fluidity patterns -->
<div class="absolute inset-0 opacity-20 mix-blend-overlay bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] pointer-events-none"></div>
<div class="absolute inset-0 bg-gradient-to-tr from-white/5 to-transparent"></div>
</div>
<!-- Subtle wave accents -->
<div class="absolute -inset-10 border border-primary/10 rounded-full animate-[ping_4s_linear_infinite] opacity-20"></div>
<div class="absolute -inset-20 border border-primary/5 rounded-full animate-[ping_6s_linear_infinite] opacity-10"></div>
</div>
</main>
<!-- Decorative Background Depth -->
<div class="fixed top-1/4 -left-20 w-[500px] h-[500px] bg-primary-container/5 rounded-full blur-[140px] pointer-events-none"></div>
<div class="fixed bottom-1/4 -right-20 w-[400px] h-[400px] bg-primary/5 rounded-full blur-[120px] pointer-events-none"></div>
</body></html>
